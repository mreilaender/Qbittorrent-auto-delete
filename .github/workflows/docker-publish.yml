name: docker-publish

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set-up-buildx
        uses: docker/setup-buildx-action@v3

      - name: log-in-to-github-container-registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qbittorrent-auto-delete:latest
            ghcr.io/${{ github.repository_owner }}/qbittorrent-auto-delete:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
