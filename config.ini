; =============================================================================
; qBittorrent Cleanup - Configuration
; =============================================================================
; Used by:
;   main.py                 - removes seeded-out torrents (run e.g. every 15-30 min)
;   torrent_ratio_logger.py - records daily ratio history   (run once per day)
;
; Copy this file to config.ini and fill in your own values.
; Run "python main.py --test" to preview removals without deleting anything.
; =============================================================================


; -----------------------------------------------------------------------------
; qBittorrent Web UI connection
; -----------------------------------------------------------------------------
[login]
; Required. Full address including protocol and port.
address = http://localhost:8080

; Preferred method (requires qBittorrent >= 5.2.0): API key authentication.
; How to generate: in the qBittorrent WebUI, open Options (gear icon) ->
; Web UI -> API key section -> click the Generate icon, then copy the key
; (it looks like qbt_ followed by 28 random characters).
; When set, the key is sent as an Authorization: Bearer header with every
; request (stateless, no login round-trip) and username/password below are
; ignored and can be left empty.
; Note: rotating the key in qBittorrent immediately invalidates the old one,
; so update it here at the same time.
api_key =

; Fallback method (works on any qBittorrent version): cookie-based login.
; Only used when api_key is empty.
username = username
password = password


; -----------------------------------------------------------------------------
; Logging
; -----------------------------------------------------------------------------
[logging]
; Levels: DEBUG, INFO, WARNING, ERROR
; DEBUG additionally shows per-torrent rule evaluation and ratio grace
; period activity in deletelog.txt - useful when tuning your rules.
log_level = INFO


; -----------------------------------------------------------------------------
; Cleanup behaviour
; -----------------------------------------------------------------------------
[cleanup]
; Categories whose torrents may be removed to free DISK SPACE
; (comma-separated, case-insensitive).
; Can be left empty: if empty, no categories will be checked for space cleanup.
categories_to_check_for_space = EX1,EX2,EX3

; Categories limited to a maximum NUMBER of torrents (comma-separated,
; case-insensitive). See max_torrents_for_categories below.
; Can be left empty: if empty, no categories will be checked for number limits.
categories_to_check_for_number = EX4

; Minimum free space to maintain on disk (in GB). When free space drops below
; this, the worst-performing eligible torrents are removed until satisfied.
; Can be set to 0: if 0, this space-based removal trigger is disabled.
min_space_gb = 350

; Minimum free space to reserve for downloads (in GB).
; This ensures extra space is available for ongoing and future downloads.
; Can be left empty or set to 0: if empty or 0, this feature is not used.
;
; How it works:
; 1. The script calculates the remaining size of all unfinished downloads
;    (actively downloading, stalled, queued, and forced downloads all count;
;    paused downloads do not).
; 2. It adds download_minspace_gb to that value to determine the total space
;    needed.
; 3. If the available space is less than this total, torrents are removed to
;    free up enough space for both the ongoing downloads and this buffer.
;
; Example: if set to 35 and 50 GB of downloads remain:
;   - The script ensures at least 85 GB (50 + 35) of free space.
;   - If less is available, it removes torrents to reach this target.
; Set this based on your typical download patterns and desired safety margin.
download_minspace_gb = 35

; Maximum number of torrents to keep per category listed in
; categories_to_check_for_number. Required if that list is not empty.
; The limit is measured against ALL torrents in the category, but only
; torrents that satisfy their [seed_rules] are ever removed - so a category
; can stay above the limit if not enough torrents are eligible yet
; (a warning is logged when this happens).
max_torrents_for_categories = 100

; Removal order when enforcing max_torrents_for_categories:
; - false: remove torrents with the worst average weekly ratio change first.
;   This takes into account seeding time, ratio history, and any bonus rules,
;   and typically keeps torrents that are still earning ratio. (Recommended.)
; - true: remove the largest torrents first, keeping the smallest ones.
sort_count_removal_by_size = false

; Path to the drive to check for free space.
; Can be left empty: if empty, the drive where the script is located is used.
drive_path =

; Skip removal of torrents containing hardlinked files (on/off).
; Deleting a hardlinked file does not free any disk space anyway (the data is
; still referenced elsewhere, e.g. by your media library), so removing such
; torrents only costs you seeding credit. Set to on to keep them.
; Note: when on, each removal candidate costs one API call + file stats,
; and you may need [path_mapping] below if qBittorrent runs in a container.
check_hardlinks = on

; Ratio grace period (in seconds). When a torrent becomes eligible for
; removal purely by hitting its ratio target (NOT by seed time), keep it
; seeding this long before actually removing it, so the tracker has time to
; register the final ratio via regular announces. Without this, small
; torrents that hit their ratio within minutes can be deleted before the
; tracker ever sees the final ratio.
; 3600 = 1 hour. Can be set to 0: if 0, torrents are removed immediately.
;
; The clock starts the first time the script observes the ratio met, so the
; effective grace is between this value and this value + your cron interval.
; State is kept in ratio_grace_state.json next to the scripts and cleans
; itself up automatically.
ratio_grace_seconds = 3600


; -----------------------------------------------------------------------------
; Per-category removal rules
; -----------------------------------------------------------------------------
[seed_rules]
; Define rules for each category.
; Format: CATEGORY = min_seed_time:SECONDS, min_ratio:RATIO
;   min_seed_time - total seeding time in SECONDS (100 hours = 360000)
;   min_ratio     - upload ratio target as a decimal number
; Either rule can be omitted, but at least one should be present.
; If both are present, a torrent becomes eligible for removal when it meets
; EITHER condition.
;
; Optional per-category grace override:
;   ratio_grace:SECONDS - overrides ratio_grace_seconds from [cleanup] for
;                         this category only, e.g.:
;                         EX2 = min_seed_time:180000, min_ratio:1.2, ratio_grace:7200
EX1 = min_seed_time:540000, min_ratio:1.1
EX2 = min_seed_time:180000, min_ratio:1.2
EX3 = min_seed_time:1260000, min_ratio:1.1
EX4 = min_seed_time:270000


; -----------------------------------------------------------------------------
; Bonus rules (removal-order weighting)
; -----------------------------------------------------------------------------
[bonus_rules]
; Multipliers applied to a torrent's average weekly ratio change, making
; long-seeded / large torrents look more valuable so they are removed LAST.
; Useful for trackers that award bonus points for long-term seeding.
; These only affect removal ORDER, never eligibility.
; This section can be left empty if no categories use bonus rules.
;
; Format: CATEGORY = min_weeks:WEEKS, time_multipliers:WEEKS:MULT,...,
;                    size_multipliers:SIZE_GB:MULT,...,
;                    extra_multiplier_weeks:WEEKS, extra_multiplier_value:VALUE
; All parameters are optional, but at least one should be present.
;   time_multipliers - weeks_seeded:multiplier pairs; the highest threshold
;                      that the torrent's seeding time reaches is used
;   size_multipliers - size_in_GB:multiplier pairs; same threshold logic
;   extra_multiplier_weeks / extra_multiplier_value
;                    - one extra multiplier once seeded at least N weeks
; Category names are case-insensitive.
EX1 = min_weeks:1, time_multipliers:2:1.05,3:1.1,4:1.125,5:1.225,6:1.3,7:1.35,8:1.4,9:1.5,10:1.6,11:1.7,12:1.8,17:1.85,18:1.9,19:1.95,20:2,33:2.125,34:2.25,35:2.375,36:2.5,53:2.625,54:2.75,55:2.875,56:3, size_multipliers:4:1.1,10:1.2,20:1.3, extra_multiplier_weeks:4, extra_multiplier_value:1.2


; -----------------------------------------------------------------------------
; Daily ratio history (torrent_ratio_logger.py)
; -----------------------------------------------------------------------------
[torrent_ratio_logger]
; Maximum number of daily ratio entries kept per torrent in
; torrent_ratio_log.json (28 = 4 weeks of history).
max_entries = 28

; Seeding-day marks at which the oldest entry is purged, so the history
; window slides forward for long-term seeds (comma-separated day numbers).
; Can be left empty: if empty, no entries are purged based on age.
purge_days = 8,16,24


; -----------------------------------------------------------------------------
; Average weekly ratio calculation
; -----------------------------------------------------------------------------
[ratio_calculation]
; Minimum assumed ratio change for torrents that haven't reached
; min_weeks_seeded yet, so brand-new torrents aren't immediately ranked as
; the worst performers and removed first.
; Can be set to 0: if 0, new torrents get no minimum assigned.
min_ratio_change = 0.3

; Number of weeks a torrent must be seeded before it's subject to normal
; ratio calculations.
; Can be set to 0: if 0, all torrents are calculated normally immediately.
min_weeks_seeded = 3


; -----------------------------------------------------------------------------
; Path translation (for hardlink checking)
; -----------------------------------------------------------------------------
[path_mapping]
; Only used when check_hardlinks = on.
; If your torrent client's mount point is named differently than the real
; mount point (e.g. qBittorrent runs in a container/VM and reports paths
; that differ from where this script sees the same files), map the prefix:
; qbt_prefix = /downloads
; actual_prefix = /mnt/storage/downloads
qbt_prefix =
actual_prefix =


; =============================================================================
; Adding a new category
; =============================================================================
; 1. Add it to categories_to_check_for_space or
;    categories_to_check_for_number in the [cleanup] section as needed.
; 2. Add a line in [seed_rules] with the category name and its rules.
; 3. If it should use bonus rules, add an entry in [bonus_rules].
;
; Example of adding a new category 'NEW_CAT':
;   In [cleanup]:    categories_to_check_for_space = EX1,EX2,EX3,NEW_CAT
;   In [seed_rules]: NEW_CAT = min_seed_time:360000, min_ratio:1.5
;   With bonus rules:
;   In [bonus_rules]: NEW_CAT = min_weeks:2, time_multipliers:4:1.2,8:1.5, size_multipliers:5:1.1,15:1.3, extra_multiplier_weeks:6, extra_multiplier_value:1.4
